# 動作設定（機密でない項目）。このファイルを config/config.yml にコピーして使う。
#   cp config/config.example.yml config/config.yml
# 企業ID・トークン・エンドポイントは .env で設定します。

work:
  # デーモンが使う所定時刻。
  #   出勤: min(この時刻＋揺らぎ幅, カレンダーの最初の業務イベント開始) を打刻締切とし、
  #         締切−揺らぎに打刻する（予定の開始までに打刻を済ませる）。
  #   退勤: max(この時刻, カレンダーの最終業務イベント終了)＋揺らぎに打刻する。
  # ※ AKASHI は打刻を「リクエスト受信時刻」で記録するため、デーモンがこの時刻に POST する。
  clock_in:  "09:30"
  clock_out: "18:00"

  # 揺らぎの幅（分）。デーモンが日毎に 0〜N分の揺らぎ秒を決めて目標時刻をずらす
  # （日毎に1回決めて固定するため、再計画しても目標はブレない）。
  #   0      = 揺らぎなし（所定時刻ちょうど）
  #   1..30  = 出勤は「締切から手前へ」、退勤は「基準から後ろへ」N分の範囲でずらす（目安は 5）
  # 出勤の締切は既定で「所定 + このウィンドウ」なので、予定がない日の打刻範囲は
  # 従来どおり 所定〜所定+N分 になる。
  # 手動打刻 `punch clock_in` の既定ウィンドウとしても使われる。
  random_window_minutes: 0       # in/out 共通の既定
  # clock_in_window:  0          # 出勤だけ別のウィンドウにしたい場合（任意・上書き）
  # clock_out_window: 5          # 退勤だけ別のウィンドウにしたい場合（任意・上書き）

schedule:
  weekdays_only: true            # 平日のみ打刻
  skip_japanese_holidays: true   # 日本の祝日はスキップ
  exclude_dates:                 # 出勤しない日（年末年始・有給等） YYYY-MM-DD
    - "2026-12-29"
    - "2026-12-30"
    - "2026-12-31"
  extra_workdays: []             # 週末/祝日でも出勤する日（最優先で対象化）

idempotency:
  check_existing: true           # 打刻前に GET で当日の在席状態(最終打刻)を確認し、既に済んでいればスキップ

token:
  path: "config/token.json"      # 再発行トークンの保存先（.gitignore 済み）
  refresh_threshold_days: 7      # 有効期限がこの日数以内になったら自動再発行

# ===== カレンダー連動デーモン（推奨）=====
# デーモン(punch daemon / launchd)は出勤・退勤の時刻を sukesan のカレンダーに合わせて動的に決めます。
# 接続情報（SUKESAN_BASE_URL / SUKESAN_API_KEY）は .env で設定します。
calendar:
  enabled: true                  # false なら出勤・退勤とも従来の固定時刻(work.clock_in/clock_out)のみ
  # 末尾イベント除外キーワード（タイトル部分一致）。
  # カレンダー末尾から、これらに一致するイベントを飛ばして最後の「業務」イベントの終了時刻を採用します。
  exclude_keywords:
    - "会食"
    - "懇親会"
    - "飲み会"
    - "打ち上げ"
    - "歓迎会"
    - "送別会"
    - "忘年会"
    - "新年会"

  # 先頭イベント除外キーワード（タイトル部分一致・出勤側）。退勤側の exclude_keywords とは独立。
  # 朝のカレンダー先頭から、これらに一致するイベントを飛ばして最初の「業務」イベントを探し、
  # その開始時刻を出勤の打刻締切にします（移動・私用など、出社前に入っている予定を無視するため）。
  # 連続してスキップします（例: 移動 8:00 → 私用 8:30 → 会議 9:00 なら会議 9:00 が締切）。
  clock_in_exclude_keywords:
    - "移動"
    - "私用"

  refresh_interval_minutes: 15   # デーモンがカレンダーを再取得する間隔（分）

  # 定期再取得が連続で何回失敗したら Slack に通知するか。
  # 再取得の失敗は退勤目標を直近の値のまま維持するだけで実害がないため、
  # DarkWake（スリープ中の一時起床）で Wi-Fi 未接続のまま1回失敗しただけでは鳴らさない。
  # 通知までの時間は「この回数 × refresh_interval_minutes」が目安（既定 3回×15分＝約30〜45分）。
  refresh_failure_notify_threshold: 3

  # 休暇イベントのキーワード（タイトル部分一致・時間の閾値なし・終日の特別扱いなし）。
  # 一致したイベントは「その時間帯は勤務しない」として扱われ、
  #   - 出勤・退勤とも業務イベントの判定から除外される
  #   - 出勤の打刻締切がその時間帯に入っていたら、休暇の終了時刻へ後ろ倒しされる（午前休）
  #   - 退勤の基準時刻がその時間帯に入っていたら、休暇の開始時刻へ前倒しされる（午後休）
  # 押し出しの結果「出勤締切 >= 退勤基準」になったら全休としてその日は打刻しない
  # （終日休暇は 00:00〜翌00:00 の休暇として、この経路で全休になります）。
  # 押し出しは基準を決めた後に行うため、休暇 15:00-19:00 の後に会議 19:00-20:00 がある日
  # （中抜け）の退勤は 20:00 のままです。
  # AKASHI は休暇申請日でも打刻を受理するため、この判定が休暇日の誤打刻を防ぐ主手段。
  # 誤検知時の復旧: カレンダーを修正して `punch recheck`。
  leave_keywords:
    - "休み"
    - "休暇"

daemon:
  tick_seconds: 30               # メインループの tick 間隔（秒）
  wake_lead_minutes: 1           # 打刻の何分前に Mac を起こすか（pmset）
  manage_wake: true              # sudoers 設定済みなら true。false なら pmset を触らない
  late_grace_minutes: 10         # 目標時刻からこの分数を超えて遅延したら打刻せずスキップ（誤時刻打刻ガード）

  # 翌営業日の朝に Mac を起こす時刻（"HH:MM"）。2つの役割を兼ねます（同じ値を使います）。
  #   (a) 起床予約: 従来は「翌営業日の所定出勤時刻」に起きていたが、朝の予定に合わせて
  #       出勤目標が所定より早くなり得るため、その前に起きておく必要がある。
  #       実際に予約するのは min(この時刻, 所定出勤時刻)（遅く設定しても従来より悪化させない）。
  #   (b) 出勤アンカーの下限: この時刻より前に始まる予定は出勤の締切に採用しない。
  #       Mac がスリープ中なら間に合わず「たまたま起きていた日だけ早朝に打刻」という
  #       非決定的な動きになるため、また深夜イベントで日付変更直後に打刻する事故を防ぐため。
  #       出勤目標もこの時刻より前には出ない（締切−揺らぎをここでクランプする）。
  # 未設定（コメントアウト）なら起床・下限とも所定出勤時刻になります。その場合、所定より前に
  # 始まる予定はアンカーにならないため、出勤のカレンダー連動は実質無効（従来どおり所定＋揺らぎ）
  # になります。朝の予定に合わせたいなら必ず設定してください（この項目が有効化スイッチを兼ねます）。
  morning_wake_at: "07:45"
